# Render Blueprint for the PlacementTrack API.
# Render dashboard -> New -> Blueprint -> pick this repo. See docs/deployment.md.
services:
  - type: web
    name: placement-track-api
    runtime: node
    plan: free
    rootDir: server
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true # Render creates a strong random secret
      - key: MONGO_URI
        sync: false # you paste the MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false # you paste the Vercel URL(s)
